[project]
name = "Himark"
version = "0.1.0"
description = ""
authors = [{ name = "BinaryBand", email = "BinaryBand@users.noreply.github.com" }]
requires-python = ">=3.11"
# Typer is the scaffold's one sanctioned runtime dependency (the standard shape
# for the cli layer). Held at the 0.16 series rather than the scaffold's 0.15:
# 0.15.x is broken against click 8.4.x (Parameter.make_metavar() signature
# change), so the 0.15 series must not be restored.
dependencies = ["antlr4-python3-runtime==4.13.2", "typer>=0.16,<0.17"]

[project.scripts]
# Installed console script; resolves to the same entry as `python -m Himark`.
"Himark" = "Himark.cli.main:main"

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
python_files = ["test_*.py"]
# importlib mode lets tests/ mirror the package layout without duplicate
# test-module basenames across layer subdirectories colliding on import.
addopts = "-v --tb=short --import-mode=importlib"

[tool.ruff]
line-length = 100
# target-version is intentionally unset: ruff derives it from requires-python
# (>=3.11 -> py311). The pinned .python-version fixes the interpreter that
# actually resolves, so the target is stated once, in one place.
# The ANTLR-generated parser is a build artifact, not authored source.
extend-exclude = ["Himark/adapters/_gen"]
force-exclude = true

[tool.ruff.lint]
# Strict by default: enable every stable rule, then subtract only the rules
# that conflict with each other, conflict with the formatter, or that we have
# a deliberate policy reason to drop. Every ignore below is justified inline so
# the ruleset is auditable and identical across projects.
select = ["ALL"]
ignore = [
    # Docstring rules that conflict with the google convention set below.
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    # Rules that conflict with `ruff format`.
    "COM812", # missing-trailing-comma
    "ISC001", # single-line-implicit-string-concatenation
    # Deliberate policy opt-outs.
    "CPY001", # missing-copyright-notice -- not wanted on internal projects
    "N999",   # invalid-module-name -- the project name is Himark, with a capital H
]

[tool.ruff.lint.per-file-ignores]
# Tests and the conftest legitimately assert, shell out, touch private members,
# use magic values, and skip docstrings/annotations.
"tests/**" = ["S", "PLR2004", "ANN", "D", "INP001", "SLF001"]
"conftest.py" = ["S", "ANN", "ARG", "D", "INP001"]
# The CLI layer is the one place print() is a legitimate output channel, and
# Typer's idioms are intentional: callables as argument/option defaults (B008)
# and boolean flags as parameters (FBT001/FBT002).
"Himark/cli/**" = ["T20", "B008", "FBT001", "FBT002"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 10
max-returns = 5
max-statements = 40

[tool.ty]
# ty runs at its default strictness, and those defaults ARE the policy here:
# every function is fully annotated (enforced by ANN) so the checker has real
# signatures to work with. When ty gains configurable rule levels worth pinning,
# set them explicitly in this section and treat a change like rolling the
# ruleset forward.
src = { exclude = ["Himark/adapters/_gen"] }

[tool.vulture]
min_confidence = 80
paths = ["Himark", "tests"]
ignore_decorators = ["@pytest.fixture", "@pytest.mark.*"]
exclude = ["*/_gen/*"]

[tool.importlinter]
root_package = "Himark"

[[tool.importlinter.contracts]]
# The one standard layout, enforced everywhere. `exhaustive = true` means any
# top-level package that is NOT one of these three is a contract violation, so
# the directory structure is mandatory rather than merely conventional. Imports
# may only point downward: cli -> adapters -> core.
name = "Standard layered layout"
type = "layers"
containers = ["Himark"]
layers = [
    "cli",
    "adapters",
    "core",
]
exhaustive = true
exhaustive_ignores = ["__main__"]

[build-system]
requires = ["uv_build>=0.9,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the importable package lives at the project root (Himark/), not
# under src/, so point the build backend at the root instead of its default
# "src".
module-root = ""
# The backend would otherwise normalize the project name to "himark"; the
# importable package keeps its capital H.
module-name = "Himark"
# _gen is gitignored, and the backend excludes gitignored files by default; name
# it explicitly so a built sdist/wheel still ships the generated parser.
source-include = ["Himark/adapters/_gen/*.py"]

[dependency-groups]
# Pinned to a series (not `>=`) so two projects scaffolded months apart enforce
# the identical ruleset; bump a pin in the scaffold template (not per project) to
# roll the standard forward. ty is pinned exactly rather than to a series because
# every ty release is still 0.0.x -- there is no meaningful series to pin to, so
# treat a ty bump like rolling the ruleset.
dev = [
    "ruff==0.15.*",
    "ty==0.0.59",
    "pytest==9.1.*",
    "hypothesis==6.156.*",
    "import-linter==2.13.*",
    "vulture==2.16.*"
]
