[project]
name = "hejmark"
version = "0.1.0"
description = ""
authors = [{ name = "BinaryBand", email = "BinaryBand@users.noreply.github.com" }]
requires-python = ">=3.11"
# Typer is the scaffold's one sanctioned runtime dependency (the standard shape
# for the cli layer). Held at the 0.16 series rather than the scaffold's 0.15:
# 0.15.x is broken against click 8.4.x (Parameter.make_metavar() signature
# change), so the 0.15 series must not be restored.
dependencies = ["antlr4-python3-runtime==4.13.2", "typer>=0.16,<0.17"]

[project.scripts]
# Installed console script; resolves to the same entry as `python -m hejmark`.
hejmark = "hejmark.cli.main:main"

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
python_files = ["test_*.py"]
# importlib mode lets tests/ mirror the package layout without duplicate
# test-module basenames across layer subdirectories colliding on import.
addopts = "-v --tb=short --import-mode=importlib"

[tool.ruff]
line-length = 100
# target-version is intentionally unset: ruff derives it from requires-python
# (>=3.11 -> py311). The pinned .python-version fixes the interpreter that
# actually resolves, so the target is stated once, in one place.
# The ANTLR-generated parser is a build artifact, not authored source.
extend-exclude = ["hejmark/adapters/_gen"]
force-exclude = true

[tool.ruff.lint]
# Strict by default: enable every stable rule, then subtract only the rules
# that conflict with each other, conflict with the formatter, or that we have
# a deliberate policy reason to drop. Every ignore below is justified inline so
# the ruleset is auditable and identical across projects.
select = ["ALL"]
ignore = [
    # Docstring rules that conflict with the google convention set below.
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    # Rules that conflict with `ruff format`.
    "COM812", # missing-trailing-comma
    "ISC001", # single-line-implicit-string-concatenation
    # Deliberate policy opt-outs.
    "CPY001", # missing-copyright-notice -- not wanted on internal projects
    # The flake8-type-checking "move this into an `if TYPE_CHECKING:` block"
    # rules, all three of them. `static/rules/no-type-checking-guard.yml`
    # forbids that block outright and IS enforced (tests/test_lint.py), so
    # leaving these on would have ruff and ast-grep issuing opposite orders on
    # the same line. The policy: imports live at module level, in one place,
    # visible to every reader and tool -- not only to a type checker. The cost
    # is a marginally slower import; that is the right trade in a language
    # chosen for readability.
    "TC001",  # typing-only-first-party-import
    "TC002",  # typing-only-third-party-import
    "TC003",  # typing-only-standard-library-import
]

[tool.ruff.lint.per-file-ignores]
# Tests and the conftest legitimately assert, shell out, touch private members,
# use magic values, and skip docstrings/annotations.
"tests/**" = ["S", "PLR2004", "ANN", "D", "INP001", "SLF001"]
"conftest.py" = ["S", "ANN", "ARG", "D", "INP001"]
# The CLI layer is the one place print() is a legitimate output channel, and
# Typer's idioms are intentional: callables as argument/option defaults (B008)
# and boolean flags as parameters (FBT001/FBT002).
"hejmark/cli/**" = ["T20", "B008", "FBT001", "FBT002"]
# The tree walker's parameters are ANTLR-generated context classes, which ship
# no stubs and share no base type worth naming -- the grammar's labelled
# alternatives are the real contract, and build.py dispatches on them. Any is
# the honest annotation here, so ANN401 is off for this module only.
"hejmark/adapters/build.py" = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 10
max-returns = 5
max-statements = 40

[tool.ty]
# ty runs at its default strictness, and those defaults ARE the policy here:
# every function is fully annotated (enforced by ANN) so the checker has real
# signatures to work with. When ty gains configurable rule levels worth pinning,
# set them explicitly in this section and treat a change like rolling the
# ruleset forward.
src = { exclude = ["hejmark/adapters/_gen"] }

[tool.vulture]
min_confidence = 80
paths = ["hejmark", "tests"]
ignore_decorators = ["@pytest.fixture", "@pytest.mark.*"]
exclude = ["*/_gen/*"]

[tool.importlinter]
root_package = "hejmark"

[[tool.importlinter.contracts]]
# The one standard layout, enforced everywhere. `exhaustive = true` means any
# top-level package that is NOT one of these three is a contract violation, so
# the directory structure is mandatory rather than merely conventional. Imports
# may only point downward: cli -> adapters -> core.
name = "Standard layered layout"
type = "layers"
containers = ["hejmark"]
layers = [
    "cli",
    "adapters",
    "core",
]
exhaustive = true
exhaustive_ignores = ["__main__"]

[[tool.importlinter.contracts]]
# The boundary, made structural. compiler, engine and contract are independent
# siblings ("|" marks packages sharing one layer): the compiler produces the
# pure-data Program (core.ir), the L2 contract intercepts it, and the engine
# consumes it -- and both edges between them, the late resolver and ToFaces,
# cross as callback values, never as imports. The contract sits here because it
# too imports only core.ir: importing neither the compiler that produced a
# program nor the engine that runs one is exactly what keeps it an optional
# stage. All three sit on the shared strata: core.ir (the payload, its codec,
# the shared exceptions) over core.floor -- which is L1 as *data* only, the five
# constructors plus the binder test. Denoting one of those trees is what it
# takes to execute it, so the denotation itself lives under core.engine.denote
# and the compiler reaches it only through the injected ToFaces. Only
# core.driver, the composition root, sees every side.
#
# `exhaustive = true` forces the placement question to be answered: a new
# core package that is not named here is a contract violation, so "which side
# of the boundary is this?" gets decided when the module is written.
name = "core partition"
type = "layers"
containers = ["hejmark.core"]
layers = [
    "driver",
    "compiler | engine | contract",
    "ir",
    "floor",
]
exhaustive = true

[[tool.importlinter.contracts]]
# Belt and braces: the sibling independence above, stated as its own contract
# so weakening the layer list can never silently permit a crossing.
name = "compiler and engine are independent"
type = "independence"
modules = [
    "hejmark.core.compiler",
    "hejmark.core.engine",
]

[[tool.importlinter.contracts]]
# The compiler's three phases, in order: resolve (P1) under expand and its
# helpers (P2) under compile (P3). `late` sits above `expand` because slot
# resolution re-enters expansion; `prelude` and `ports` are inputs to the
# driver's use of the compiler and sit above the phases they lean on. `prelude`
# seeds `alphabet` (the host-supplied `char`) into the namespace it assembles.
name = "compiler pipeline"
type = "layers"
containers = ["hejmark.core.compiler"]
layers = [
    "compile",
    "prelude",
    "ports",
    "late",
    "expand",
    "valueline",
    "alphabet",
    "resolve",
    "ast",
]
exhaustive = true

[[tool.importlinter.contracts]]
# The engine's three strata: the executor drives the scanner, the scanner asks
# denotation, and denotation knows about neither. `denote` is the bottom because
# it is the one stratum written against floor syntax alone -- the piece a host in
# another language must reimplement, and the piece the compiler is allowed to
# reach only as an injected callback.
name = "engine pipeline"
type = "layers"
containers = ["hejmark.core.engine"]
layers = [
    "service",
    "execute",
    "scan",
    "denote",
]
exhaustive = true

[[tool.importlinter.contracts]]
# Denotation's own order: `universe` denotes a brace expression, `window` views a
# range as a half-open interval, `order` fixes the shortlex order both are
# defined against. A leaf per level, nothing circular.
name = "denote stratum"
type = "layers"
containers = ["hejmark.core.engine.denote"]
layers = [
    "universe",
    "window",
    "order",
]
exhaustive = true

[[tool.importlinter.contracts]]
# The boundary stratum itself is layered: the wire format reads the codec,
# the codec builds the program shapes, and the exceptions sit under everything.
name = "ir stratum"
type = "layers"
containers = ["hejmark.core.ir"]
layers = [
    "wire",
    "codec",
    "ports",
    "program",
    "errors",
]
exhaustive = true

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the importable package lives at the project root (hejmark/), not
# under src/, so point the build backend at the root instead of its default
# "src".
module-root = ""
module-name = "hejmark"
# _gen is gitignored, and the backend excludes gitignored files by default; name
# it explicitly so a built sdist/wheel still ships the generated parser.
source-include = ["hejmark/adapters/_gen/*.py"]

[dependency-groups]
# Pinned to a series (not `>=`) so two projects scaffolded months apart enforce
# the identical ruleset; bump a pin in the scaffold template (not per project) to
# roll the standard forward. ty is pinned exactly rather than to a series because
# every ty release is still 0.0.x -- there is no meaningful series to pin to, so
# treat a ty bump like rolling the ruleset.
dev = [
    "ruff==0.15.*",
    "ty==0.0.59",
    "pytest==9.1.*",
    "hypothesis==6.156.*",
    "import-linter==2.13.*",
    "vulture==2.16.*",
    # Structural lint for the house rules ruff has no equivalent for; the rules
    # live in static/rules/ and sgconfig.yml points at them. Ships the
    # `ast-grep` console script that tests/test_lint.py shells out to.
    "ast-grep-cli==0.44.*",
    # Installs the `antlr4` console script used by `hejmark gen-parser` /
    # tests/infrastructure/test_antlr.py. It's a code-generation-time tool
    # (wraps the Java antlr4 jar, auto-downloading it and a JRE if needed),
    # not something the shipped package imports, so it lives in dev rather
    # than [project.dependencies].
    "antlr4-tools==0.2.*",
    "mdformat>=1.0.0",
    "mdformat-myst>=0.3.0",
    "pymarkdownlnt>=0.9.39",
    "emoji>=2.15.0",
]
