[project]
name = "Himark"
version = "0.1.0"
description = ""
authors = [{ name = "BinaryBand", email = "BinaryBand@users.noreply.github.com" }]
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# S101 bans bare `assert` outside tests; use explicit exceptions since
# assertions can be disabled with -O.
select = ["E", "F", "I", "UP", "B", "SIM", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"conftest.py" = ["S101"]

[tool.vulture]
min_confidence = 80
paths = ["Himark", "tests"]
ignore_decorators = ["@pytest.fixture", "@pytest.mark.*"]

[tool.importlinter]
root_package = "Himark"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "ty>=0.0.1",
    "pytest>=9.0",
    "hypothesis>=6.0",
    "import-linter>=2.0",
    "vulture>=2.14",
    "ast-grep-cli>=0.44",
]
