# The Rust half of hejmark: a standalone port of core/, grown one
# self-contained slice at a time. It has no dependencies and is exercised
# entirely by `cargo test`, which the Python suite drives through
# tests/test_rust.py (cargo fmt --check, clippy -D warnings, cargo test).
[package]
name = "hejmark"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "hejmark"
path = "src/lib.rs"
# `cdylib` is for the Flutter app under gui/: Android cannot spawn the Python
# compiler, so it links this crate and calls src/ffi.rs over Dart's FFI. `rlib`
# has to be named alongside it or the `find` binary and the test harness lose
# the Rust-native library they link against.
crate-type = ["rlib", "cdylib"]
